[workspace]
members = [
    "crates/gugu-base",
    "crates/gugu-cli",
    "crates/gugu-compiler",
    "crates/gugu-compiler-core",
    "crates/gugu-frontend",
    "crates/gugu-project",
    "crates/gugu-runtime-builder",
]
resolver = "3"

[workspace.dependencies]
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
unicode-width = "0.2"

[profile.test]
# 测试只验证正确性，但全量套件要在一分钟内跑完：编译器本体在 O0 下慢 3-4 倍，
# 单次编译 runtime 源树要十几秒。O2 是编译时间与执行时间的平衡点（O3 收益有限）。
opt-level = 2
debug = 1
debug-assertions = false
overflow-checks = true

# build script 要跑一次完整的内建块派生并把结果物化进 artifact；debug/test 档默认 O0 会把它
# 拖到十几秒，这里按 O2 编译 build script 自己的依赖。
[profile.dev.build-override]
opt-level = 2

[profile.test.build-override]
opt-level = 2
