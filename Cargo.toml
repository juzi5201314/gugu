[workspace]
members = [
    "crates/gugu-backend",
    "crates/gugu-base",
    "crates/gugu-cli",
    "crates/gugu-compiler",
    "crates/gugu-compiler-core",
    "crates/gugu-frontend",
    "crates/gugu-gir",
    "crates/gugu-lir",
    "crates/gugu-project",
    "crates/gugu-runtime-abi",
    "crates/gugu-runtime-builder",
    "crates/gugu-runtime-world",
    "crates/gugu-sema",
]
resolver = "3"

[workspace.dependencies]
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
unicode-width = "0.2"

[profile.dev]
# 编译器的规范编解码与分析热路径需要优化；开发与测试共用该配置，避免额外 profile 产物。
opt-level = 3
debug = 1
debug-assertions = true
overflow-checks = true

# build script 要跑一次完整的内建块派生并把结果物化进 artifact；debug/test 档默认 O0 会把它
# 拖到十几秒，这里与开发档一样按 O3 编译 build script 自己的依赖。
[profile.dev.build-override]
opt-level = 3

