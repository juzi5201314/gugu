[package]
name = "gugu-sema"
version = "0.1.0"
edition = "2024"
description = "Gugu semantic layer: lexing, parsing, cfg, macro expansion, name resolution, type checking and frozen HIR"

[features]
# frontend 的 lex/parse/comptime 测试复用这里的转储与评估开关；只经 frontend 的 dev-dependency 打开。
test-support = []

[dependencies]
blake3 = "1"
serde.workspace = true
serde_json.workspace = true

gugu-base = { path = "../gugu-base" }
gugu-compiler-core = { path = "../gugu-compiler-core" }
gugu-runtime-abi = { path = "../gugu-runtime-abi" }
