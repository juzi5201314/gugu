nextest-version = "0.9.115"

[profile.default]
# 调度槽随可用 CPU 数伸缩；重编译用例按权重占槽，限制并发资源竞争。
# 单项仍限制为 3 秒，整轮仍限制为 120 秒。
test-threads = "num-cpus"
retries = 0
fail-fast = true
# 单个用例超过 3 秒即视为缺陷：超时直接失败并杀死测试进程组。
slow-timeout = { period = "3s", terminate-after = 1, grace-period = "1s", on-timeout = "fail" }
# 整轮（含 slow-tests）必须收敛在两分钟以内。
global-timeout = "120s"

# 单次整体编译用例占用两个调度槽，限制编译并发与内存带宽争用。
[[profile.default.overrides]]
filter = 'test(/^lir_tests::(spawn_result_kind_matches_the_payload_roots|bare_barrier_sites_have_mandatory_call_return_records|runtime_machine_calls_enter_lir_with_glue_shape|root_init_narrows_union_words_by_variant|root_init_events_track_pointer_fields_only|init_proof_marks_only_fully_written_slots|safepoints_root_every_live_value_in_their_world_stackmap)$/) | test(/^numbering_tests::\w+_install_like_a_fresh_derivation$/) | test(/frontend::semantics_tests::comptime::user_functions_are_interpreted_with_capability_propagation$/) | test(/frontend::semantics_tests::opaque::apit_occurrences_have_independent_types_and_enforce_bounds$/) | test(/runtime::(collections_tests::std_collections_are_importable_and_require_stable_keys|blocking_io_tests::std_io_and_path_compile_and_user_path_stays_reserved|foreign_tests::compiled_foreign_sites_enter_the_runtime_contract|wait_tests::channel_demand_reaches_(linux|windows)_image_plan|compression_tests::real_compilation_defaults_to_disabled_compression|coroutine_tests::source_coroutines_reach_(linux|windows)_image_plan|provenance_tests::(real_compilation_defaults_to_release_provenance|safety_profile_participates_in_contract_identity_and_action_key)|routing_tests::(real_compilation_defaults_to_direct_routing|routing_mode_participates_in_contract_identity))$/) | test(/(image_plan_reports_turn_region_contract|main_result_type_enters_rt0_demand_and_contract|configured_target_changes_raw_contract_fingerprint|gc_metadata_fingerprint_changes_with_type_table)$/)'
threads-required = 2

# slow-tests 中的三槽用例；随总槽数限制并发，不固定独占运行。
[[profile.default.overrides]]
filter = 'test(/frontend::semantics_tests::runtime::runtime_publish_resolves_imports_and_canonical_paths$/) | test(/frontend::semantics_tests::opaque::generic_opaque_instances_preserve_declared_type_parameters$/) | test(/build_json_reports_shared_heap_contract_keys$/)'
threads-required = 3

# frontend 内聚合编译与多场景测试及轻量集成测试占三槽（12 槽时四并发），避开 SMT 与 L3 带宽争用，使每组稳定落在 3 秒上限内。
[[profile.default.overrides]]
filter = '(package(gugu-frontend) & test(/^(filesystem_tests::(docs_examples|float_formatting|collections|const_generics|formatting|array_init|a64_binding|process|platform|network|printing|strings|debug_builders|hashing|resource)|frontend::semantics_tests::array_init)::/)) | (package(gugu-compiler) & binary(=integration) & test(/^(abi_image_consistency|doc|harness|callback|native_link|filesystem|shared_handle|pin|channel_resume|foreign_roots|runtime_stats)::/))'
threads-required = 3

# 重型集成镜像、物化复现与重型 frontend 解释用例占四槽（12 槽时最多三并发），在保持三秒安全余量的同时提升物理核吞吐。
[[profile.default.overrides]]
filter = '(package(gugu-compiler) & binary(=integration) & test(/^(materialization_equivalence|network|process|harness::(test_domain|bench_domain))/)) | test(resolver_cancellation_releases_late_result_and_wakes_only_once) | (package(gugu-frontend) & test(/^filesystem_tests::(collections::collections_(maps_sets|aggregate_keys)|process::snapshot::process_snapshots|resource::collection::major_collection)/))'
threads-required = 4

# 较重的多轮编译对比用例占六槽；12 槽时最多两个并发，六槽及以下独占。
[[profile.default.overrides]]
filter = 'test(/^lir_tests::(stackmap_world_covers_call_poll_suspend_and_select|cached_lir_matches_fresh_output_and_action_identity)$/) | test(/^mono::tests::(public_summary_changes_with_effects_but_not_private_definition_ids|changed_source_with_shared_queries_matches_a_fresh_world)$/) | test(/frontend::semantics_tests::runtime_checks_survive_queries_and_reach_the_backend_plan$/) | test(/frontend::semantics_tests::comptime::action_key_is_deterministic_and_input_sensitive$/)'
threads-required = 6

# a64 整程序装配用例每次编译一到两个完整程序（闭世界 LIR + 平台片段 + 镜像），
# 占六槽并放宽单项时限：并行负载下两次顺序装配可超过默认 3 秒。
[[profile.default.overrides]]
filter = 'test(/^filesystem_tests::a64_image::/)'
threads-required = 6
slow-timeout = { period = "10s", terminate-after = 1, grace-period = "1s", on-timeout = "fail" }
